<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - ÉxitoImpulso</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="form-container">
        <h2>Iniciar Sesión en ÉxitoImpulso</h2>
        <div id="mensaje" class="mensaje-error"></div>
        
        <form id="formLogin">
            <input type="email" id="correo" placeholder="Correo electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            
            <button type="submit">Ingresar</button>
            <p>¿Olvidaste tu contraseña? <a href="../recuperar/index.html">Recuperar</a></p>
            <p>¿No tienes cuenta? <a href="../registro/index.html">Registrarse</a></p> 
        </form>
    </div>

    <script src="../assets/js/login.js"></script>
</body>
</html>
